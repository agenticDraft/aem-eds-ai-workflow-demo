name: Validate eds pack

on:
  push:
    branches: [main]
    paths:
      - 'plugins/eds/**'
      - '.github/workflows/validate-eds-pack.yaml'
  pull_request:
    paths:
      - 'plugins/eds/**'
      - '.github/workflows/validate-eds-pack.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install project devDependencies
        run: npm ci
      - name: every eds suite
        run: |
          failed=0
          for t in $(find plugins/eds -name '*.test.sh' | sort); do
            echo "::group::$t"
            if ! bash "$t"; then
              failed=$((failed + 1))
              echo "::error file=$t::suite failed"
            fi
            echo "::endgroup::"
          done
          echo "failed suites: $failed"
          [ "$failed" -eq 0 ]
      - name: every node reference in an eds skill names a heading
        run: bash plugins/agentic-core/shared/lib/validate-contracts.sh plugins/eds
      - name: Validate eds pack manifest
        run: bash plugins/agentic-core/shared/lib/validate-pack-manifest.sh plugins/eds/pack.yaml
