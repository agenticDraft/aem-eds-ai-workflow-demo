name: Validate agentic-core

on:
  push:
    branches: [main]
    paths:
      - 'plugins/agentic-core/**'
      - '.github/workflows/validate-agentic-core.yaml'
      - '.ai/project-config.yaml'
      - 'triggers/jira/**'
      - '.claude/settings.json'
  pull_request:
    # No branch filter on purpose. A pull request into a long-lived
    # integration branch changes these files just as much as one into the
    # default branch does, and a list of target branches goes stale the next
    # time someone opens one — silently, by letting those merges through
    # unchecked. The paths filter below is what keeps this cheap.
    paths:
      - 'plugins/agentic-core/**'
      - '.github/workflows/validate-agentic-core.yaml'
      - '.ai/project-config.yaml'
      - 'triggers/jira/**'
      - '.claude/settings.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: every plain-invoked script is executable
        run: bash plugins/agentic-core/shared/lib/check-exec-bits.test.sh
      - name: the driver's instructions carry a current stamp
        run: bash plugins/agentic-core/shared/lib/instructions-stamp.test.sh
      - name: a stage emits its envelope through the emitter
        run: bash plugins/agentic-core/shared/lib/emit-envelope.test.sh
      - name: a captured envelope is reduced before it is judged
        run: bash plugins/agentic-core/shared/lib/capture-envelope.test.sh
      - name: a branch name is derived, never chosen
        run: bash plugins/agentic-core/shared/lib/derive-branch-name.test.sh
      - name: a trigger event is claimed once, atomically
        run: bash plugins/agentic-core/shared/lib/claim-run.test.sh
      - name: the route policy fails closed, and this repository's policy is valid
        run: |
          bash plugins/agentic-core/shared/lib/check-route-policy.test.sh
          bash plugins/agentic-core/shared/lib/check-route-policy.sh .ai/route-policy.yaml
      - name: daily run limits are counted from the claims, fail-closed
        run: bash plugins/agentic-core/shared/lib/check-run-limits.test.sh
      - name: a forbidden tool rule matches what it names and nothing else
        run: node --test plugins/agentic-core/shared/runner/policy-match.test.mjs
      - name: the network allowlist is read fail-closed, and this repository's list is usable
        run: |
          node --test plugins/agentic-core/shared/runner/network-allowlist.test.mjs
          node --input-type=module -e "import { readAllowedDomains } from './plugins/agentic-core/shared/runner/network-allowlist.mjs'; console.log(readAllowedDomains('.claude/settings.json').length + ' domain(s)')"
      - name: a whole route is judged by its terminal state, not by the session's last message
        run: |
          node --test plugins/agentic-core/shared/runner/terminal-capture.test.mjs
          bash plugins/agentic-core/shared/lib/check-terminal-state.test.sh
      - name: every refused call is printed whole in the run's log
        run: node --test plugins/agentic-core/shared/runner/denials.test.mjs
      - name: a command shape dontAsk refuses is refused first, with what to write instead
        run: node --test plugins/agentic-core/shared/runner/shell-shape.test.mjs
      - name: a route session may not end before its terminal state is recorded
        run: node --test plugins/agentic-core/shared/runner/stop-guard.test.mjs
      - name: the change set is the merge-base diff plus untracked files
        run: bash plugins/agentic-core/shared/lib/list-changed-files.test.sh
      - name: Validate result envelope
        run: bash plugins/agentic-core/shared/lib/validate-result-envelope.test.sh
      - name: Validate subagent outcome
        run: bash plugins/agentic-core/shared/lib/validate-subagent-outcome.test.sh
      - name: Validate project config
        run: bash plugins/agentic-core/shared/lib/validate-project-config.test.sh
      - name: Check trigger identity
        run: bash plugins/agentic-core/shared/lib/check-trigger-identity.test.sh
      - name: Check trigger config
        run: |
          bash plugins/agentic-core/shared/lib/check-trigger-config.test.sh
          bash plugins/agentic-core/shared/lib/check-trigger-config.sh \
            .ai/project-config.yaml \
            triggers/jira/route-trigger.rule.json
      - name: Validate pack manifest
        run: bash plugins/agentic-core/shared/lib/validate-pack-manifest.test.sh
      - name: a branch name meets the platform pack's declared rule
        run: bash plugins/agentic-core/shared/lib/check-branch-name.test.sh
      - name: a branch-creating command is blocked when its name fails
        run: bash plugins/agentic-core/shared/lib/check-branch-command.test.sh
      - name: Validate naming rule
        run: bash plugins/agentic-core/shared/lib/validate-naming-rule.test.sh
      - name: a shipped file carries no narrative
        run: bash plugins/agentic-core/shared/lib/check-no-narrative.test.sh
      - name: Validate artifact registry
        run: bash plugins/agentic-core/shared/lib/validate-artifact-registry.test.sh
      - name: Check plan criteria
        run: bash plugins/agentic-core/shared/lib/check-plan-criteria.test.sh
      - name: Check publish criteria
        run: bash plugins/agentic-core/shared/lib/check-publish-criteria.test.sh
      - name: Check readiness criteria
        run: bash plugins/agentic-core/shared/lib/check-readiness-criteria.test.sh
      - name: Render analytics
        run: bash plugins/agentic-core/shared/lib/render-analytics.test.sh
      - name: Write orchestration flag
        run: bash plugins/agentic-core/shared/lib/write-orchestration-flag.test.sh
      - name: Check orchestration flag
        run: bash plugins/agentic-core/shared/lib/check-orchestration-flag.test.sh
      - name: Finalize orchestration flag
        run: bash plugins/agentic-core/shared/lib/finalize-orchestration-flag.test.sh
      - name: Evaluate stage conditions
        run: bash plugins/agentic-core/shared/lib/evaluate-stage-conditions.test.sh
      - name: Write run state
        run: bash plugins/agentic-core/shared/lib/write-run-state.test.sh
      - name: Check run state
        run: bash plugins/agentic-core/shared/lib/check-run-state.test.sh
      - name: a fresh start archives the previous run's context
        run: bash plugins/agentic-core/shared/lib/archive-run-context.test.sh
      - name: a fresh start refuses a tree that already holds a change
        run: bash plugins/agentic-core/shared/lib/check-tree-clean.test.sh
      - name: Check onboarding gate
        run: bash plugins/agentic-core/shared/lib/check-onboarding-gate.test.sh
      - name: Check preflight
        run: bash plugins/agentic-core/shared/lib/check-preflight.test.sh
      - name: Run stage
        run: bash plugins/agentic-core/shared/lib/run-stage.test.sh
      - name: Handle question
        run: bash plugins/agentic-core/shared/lib/handle-question.test.sh
      - name: Write question answer
        run: bash plugins/agentic-core/shared/lib/write-question-answer.test.sh
      - name: Read question answer
        run: bash plugins/agentic-core/shared/lib/read-question-answer.test.sh
      - name: Generate pack
        run: bash plugins/agentic-core/shared/lib/generate-pack.test.sh
      - name: Generate provider pack
        run: bash plugins/agentic-core/shared/lib/generate-provider-pack.test.sh
      - name: Check requires
        run: bash plugins/agentic-core/shared/lib/check-requires.test.sh
      - name: Validate contracts (skill-authoring)
        run: bash plugins/agentic-core/shared/lib/validate-contracts.test.sh
      - name: Check driver read allowlist
        run: bash plugins/agentic-core/skills/run-route/scripts/check-driver-read.test.sh
      - name: Check direct script calls
        run: bash plugins/agentic-core/shared/lib/check-direct-script-calls.test.sh
      - name: Validate plugin manifest
        run: claude plugin validate plugins/agentic-core --strict
