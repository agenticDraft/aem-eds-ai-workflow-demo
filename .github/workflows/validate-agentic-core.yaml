name: Validate agentic-core

on:
  push:
    branches: [main]
    paths:
      - 'plugins/agentic-core/**'
      - '.github/workflows/validate-agentic-core.yaml'
  pull_request:
    # No branch filter on purpose. A pull request into a long-lived
    # integration branch changes these files just as much as one into the
    # default branch does, and a list of target branches goes stale the next
    # time someone opens one — silently, by letting those merges through
    # unchecked. The paths filter below is what keeps this cheap.
    paths:
      - 'plugins/agentic-core/**'
      - '.github/workflows/validate-agentic-core.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: the driver's instructions carry a current stamp
        run: bash plugins/agentic-core/shared/lib/instructions-stamp.test.sh
      - name: a stage emits its envelope through the emitter
        run: bash plugins/agentic-core/shared/lib/emit-envelope.test.sh
      - name: a captured envelope is reduced before it is judged
        run: bash plugins/agentic-core/shared/lib/capture-envelope.test.sh
      - name: a branch name is derived, never chosen
        run: bash plugins/agentic-core/shared/lib/derive-branch-name.test.sh
      - name: Validate result envelope
        run: bash plugins/agentic-core/shared/lib/validate-result-envelope.test.sh
      - name: Validate subagent outcome
        run: bash plugins/agentic-core/shared/lib/validate-subagent-outcome.test.sh
      - name: Validate project config
        run: bash plugins/agentic-core/shared/lib/validate-project-config.test.sh
      - name: Validate pack manifest
        run: bash plugins/agentic-core/shared/lib/validate-pack-manifest.test.sh
      - name: Validate naming rule
        run: bash plugins/agentic-core/shared/lib/validate-naming-rule.test.sh
      - name: Validate artifact registry
        run: bash plugins/agentic-core/shared/lib/validate-artifact-registry.test.sh
      - name: Check plan criteria
        run: bash plugins/agentic-core/shared/lib/check-plan-criteria.test.sh
      - name: Check publish criteria
        run: bash plugins/agentic-core/shared/lib/check-publish-criteria.test.sh
      - name: Check readiness criteria
        run: bash plugins/agentic-core/shared/lib/check-readiness-criteria.test.sh
      - name: Render analytics
        run: bash plugins/agentic-core/shared/lib/render-analytics.test.sh
      - name: Write orchestration flag
        run: bash plugins/agentic-core/shared/lib/write-orchestration-flag.test.sh
      - name: Check orchestration flag
        run: bash plugins/agentic-core/shared/lib/check-orchestration-flag.test.sh
      - name: Finalize orchestration flag
        run: bash plugins/agentic-core/shared/lib/finalize-orchestration-flag.test.sh
      - name: Evaluate stage conditions
        run: bash plugins/agentic-core/shared/lib/evaluate-stage-conditions.test.sh
      - name: Write run state
        run: bash plugins/agentic-core/shared/lib/write-run-state.test.sh
      - name: Check run state
        run: bash plugins/agentic-core/shared/lib/check-run-state.test.sh
      - name: Check onboarding gate
        run: bash plugins/agentic-core/shared/lib/check-onboarding-gate.test.sh
      - name: Check preflight
        run: bash plugins/agentic-core/shared/lib/check-preflight.test.sh
      - name: Run stage
        run: bash plugins/agentic-core/shared/lib/run-stage.test.sh
      - name: Generate pack
        run: bash plugins/agentic-core/shared/lib/generate-pack.test.sh
      - name: Generate provider pack
        run: bash plugins/agentic-core/shared/lib/generate-provider-pack.test.sh
      - name: Check requires
        run: bash plugins/agentic-core/shared/lib/check-requires.test.sh
      - name: Validate contracts (skill-authoring)
        run: bash plugins/agentic-core/shared/lib/validate-contracts.test.sh
      - name: Check driver read allowlist
        run: bash plugins/agentic-core/skills/run-route/scripts/check-driver-read.test.sh
      - name: Validate plugin manifest
        run: claude plugin validate plugins/agentic-core --strict
