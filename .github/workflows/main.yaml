name: Build
on:
  push:
    # The claim tags the delivery automation pushes (agentic-run/<item>-c<comment>)
    # carry no code change; a Build on each would be noise.
    tags-ignore: ['agentic-run/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - run: npm run lint
