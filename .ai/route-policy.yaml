version: 1

# Tool rules a headless route may never run, whatever the allow rules say.
forbidden:
  # A route ends at a pull request; review and merge stay human.
  - "Bash(gh pr merge*)"
  # No history rewrites on the remote.
  - "Bash(git push --force*)"
  - "Bash(git push * --force*)"
  - "Bash(git push -f*)"
  - "Bash(git push * -f)"
  - "Bash(git push * -f *)"
  # Never the default branch.
  - "Bash(git push * main)"
  - "Bash(git push * main *)"
  - "Bash(git push * HEAD:main*)"
  - "Bash(git push * *:main)"
  - "Bash(git push * *:refs/heads/main*)"
  # Forms that push the current branch without naming it. The scm scripts
  # refuse the default branch themselves; these rules cover a direct call.
  - "Bash(git push)"
  - "Bash(git push origin)"
  - "Bash(git push * HEAD)"
  - "Bash(git push * HEAD *)"
  # Claim tags belong to the trigger, not to a session.
  - "Bash(git push --tags*)"
  - "Bash(git push * --tags*)"
  - "Bash(git push * refs/tags/*)"
  # No deleting remote refs.
  - "Bash(git push --delete*)"
  - "Bash(git push * --delete*)"

limits:
  runs_per_identity_per_day: 10
  runs_per_day: 30

budget:
  max_usd_per_run: 15

caps:
  max_turns: 200
  timeout_minutes: 45

break_glass:
  word: "override"
