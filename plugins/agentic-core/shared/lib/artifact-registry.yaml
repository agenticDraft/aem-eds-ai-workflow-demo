- id: fact-record
  version: "1.0"
  produced_by: intake
  required_content: item_id, item_type, labels, components, design_source, files_named — facts only, no conclusions
  validation: item_id non-empty; item_type present
- id: sanitized-spec
  version: "1.0"
  produced_by: intake
  required_content: the work item's text, sanitized
  validation: no executable directives
- id: branch
  version: "1.0"
  produced_by: runner
  required_content: the branch name this run works on, one line, derived from the item id
  validation: non-empty; a valid branch name
- id: run-state
  version: "1.0"
  produced_by: runner
  required_content: last_stage, total, mode, questions_used, start_time
  validation: stage count consistent
- id: progress
  version: "1.0"
  produced_by: runner
  required_content: one row per stage
  validation: row count equals resolved total
- id: orchestration-marker
  version: "1.0"
  produced_by: runner
  required_content: presence and mtime only
  validation: absent after every terminal state
- id: question-answer
  version: "1.1"
  produced_by: runner
  required_content: stage, question and answer fields, the last two verbatim
  validation: all three non-empty; stage is a stage id; neither question nor answer contains a double quote
- id: analytics
  version: "1.0"
  produced_by: runner
  required_content: peak context and cumulative billed input, kept distinct, plus wall clock, for the run and for each subagent
  validation: every number traces to a transcript line's own usage object, never model-reported
