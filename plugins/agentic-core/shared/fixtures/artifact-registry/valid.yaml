- id: fact-record
  version: "1.0"
  produced_by: intake
  required_content: item_id, item_type, labels, components, design_source, files_named, explicit_route
  validation: item_id non-empty; item_type present
- id: change-summary
  version: "1.0"
  produced_by: deliver
  required_content: the published location and a one-line summary of what shipped
  validation: location is a resolvable reference; summary is non-empty
- id: plan-gate-finding
  version: "1.0"
  produced_by: plan-gate
  required_content: each of the plan-gate criteria, answered
  validation: every criterion present; each answerable yes or no
- id: publish-gate-finding
  version: "1.0"
  produced_by: publish-gate
  required_content: findings against the actual change, not a description of it
  validation: no finding above the adapter's confidence threshold
- id: run-state
  version: "1.0"
  produced_by: runner
  required_content: route_id, rule, last_stage, total, mode, questions_used, start_time
  validation: valid route id; stage count consistent
