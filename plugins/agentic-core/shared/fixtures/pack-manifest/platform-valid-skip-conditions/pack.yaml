kind: platform
stages:
  intake: intake
  implement: implement
  deliver: deliver
always_autonomous: [deliver]
artifacts:
  - id: fact-record
    produced_by: intake
    path: ".ai/run-context/fact-record.yaml"
  - id: change-summary
    produced_by: implement
    path: ".ai/run-context/change-summary.md"
skip_when_missing:
  implement: ".ai/run-context/change-request.yaml"
