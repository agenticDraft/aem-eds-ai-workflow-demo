kind: platform
stages:
  - id: intake
    skill: intake
  - id: implement
    skill: implement
  - id: deliver
    skill: deliver
always_autonomous: [deliver]
readiness_criteria:
  task:
    require: [has_description]
artifacts:
  - id: fact-record
    produced_by: intake
    path: "{{ spec_dir }}/fact-record.yaml"
