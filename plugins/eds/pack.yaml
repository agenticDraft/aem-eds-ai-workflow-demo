kind: platform
stages:
  - id: intake
    skill: eds-intake
  - id: readiness
    skill: eds-readiness
  - id: extract
    skill: eds-extract
    when:
      - { design_source: true }
      - { design_mentioned: true }
  - id: conventions
    skill: eds-conventions
  - id: serve
    skill: eds-serve
    fix_attempts: 5
  - id: baseline
    skill: eds-baseline
    when:
      - { components: present }
  - id: prototype
    skill: eds-prototype
    when:
      - { design_source: true }
      - { design_mentioned: true }
  - id: verify-design
    skill: eds-verify-design
    when:
      - { design_source: true }
      - { design_mentioned: true }
    fix_attempts: 2
  - id: plan
    skill: eds-plan
    fix_attempts: 1
  - id: plan-gate
    skill: eds-plan-gate
  - id: implement
    skill: eds-implement
  - id: verify
    skill: eds-verify
  - id: lint
    skill: eds-lint
    fix_attempts: 3
  - id: publish-gate
    skill: eds-publish-gate
  - id: deliver
    skill: eds-deliver
always_autonomous: []
readiness_criteria:
  Story:
    require: [has_description, has_acceptance_criteria]
  Bug:
    require: [has_description, has_reproduction_url, has_reproduction_steps]
artifacts:
  - id: fact-record
    produced_by: intake
    path: ".ai/run-context/fact-record.yaml"
  - id: sanitized-spec
    produced_by: intake
    path: ".ai/run-context/sanitized-spec.md"
  - id: plan
    produced_by: plan
    path: ".ai/run-context/plan.yaml"
  - id: baseline-capture
    produced_by: baseline
    path: ".ai/run-context/baseline-capture.json"
  - id: design-reference
    produced_by: extract
    path: ".ai/run-context/design-reference.json"
  - id: design-conventions
    produced_by: conventions
    path: ".ai/run-context/design-conventions.md"
  - id: prototype-report
    produced_by: prototype
    path: ".ai/run-context/prototype-report.md"
  - id: serve-report
    produced_by: serve
    path: ".ai/run-context/serve-report.md"
  - id: verify-report
    produced_by: verify
    path: ".ai/run-context/verify-report.md"
  - id: lint-report
    produced_by: lint
    path: ".ai/run-context/lint-report.md"
  - id: delivery-report
    produced_by: deliver
    path: ".ai/run-context/delivery-report.md"
